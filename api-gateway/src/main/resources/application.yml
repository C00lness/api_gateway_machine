server:
  port: 8080

spring:
  data:
    redis:
      host: localhost
      port: 6379
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/users/**,/auth/**
        - id: program-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/programs/**
          filters:
            - name: RequestRateLimiter
              args:
                key-resolver: "#{@ipKeyResolver}" # Ссылка на наш бин
                redis-rate-limiter.replenishRate: 10 # 10 запросов в секунду восстанавливается
                redis-rate-limiter.burstCapacity: 20 # Максимум 20 запросов за раз (всплеск)


management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

